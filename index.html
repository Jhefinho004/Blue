<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>B.L.U.E.</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at center, #101b3d 0%, #05070d 45%, #020308 100%);
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid rgba(80, 120, 255, 0.2);
    }

    header h1 {
      font-size: 30px;
      letter-spacing: 7px;
      text-shadow: 0 0 15px #4169ff;
    }

    header p {
      margin-top: 6px;
      color: #718cff;
      font-size: 11px;
      letter-spacing: 3px;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 25px 18px;
    }

    .core {
      width: 125px;
      height: 125px;
      border-radius: 50%;
      border: 2px solid #4169ff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 15px 0 25px;

      box-shadow:
        0 0 20px #4169ff,
        0 0 60px rgba(65, 105, 255, 0.35),
        inset 0 0 30px rgba(65, 105, 255, 0.25);

      animation: pulse 2.5s infinite;
    }

    .core::before {
      content: "";
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: #4169ff;
      box-shadow: 0 0 35px #4169ff;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.07);
      }
    }

    .status {
      color: #7f91b8;
      font-size: 12px;
      margin-bottom: 18px;
    }

    .chat {
      width: 100%;
      max-width: 600px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 85%;
      padding: 12px 15px;
      border-radius: 15px;
      line-height: 1.4;
      font-size: 14px;
      white-space: pre-wrap;
    }

    .user {
      align-self: flex-end;
      background: #3155d9;
      border-bottom-right-radius: 4px;
    }

    .blue {
      align-self: flex-start;
      background: #101827;
      border: 1px solid #24375f;
      border-bottom-left-radius: 4px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    #messageInput {
      flex: 1;
      background: #0b101c;
      border: 1px solid #263557;
      border-radius: 14px;
      padding: 15px;
      color: white;
      outline: none;
      font-size: 15px;
    }

    #messageInput:focus {
      border-color: #4169ff;
      box-shadow: 0 0 10px rgba(65, 105, 255, 0.2);
    }

    #sendButton {
      width: 55px;
      border: none;
      border-radius: 14px;
      background: #4169ff;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    #sendButton:active {
      transform: scale(0.95);
    }

    footer {
      padding: 12px;
      text-align: center;
      color: #4e5d7d;
      font-size: 10px;
    }
  </style>
</head>

<body>

  <header>
    <h1>B.L.U.E.</h1>
    <p>PERSONAL AI ASSISTANT</p>
  </header>

  <main>

    <div class="core"></div>

    <div class="status" id="status">
      Sistema online • Aguardando comando
    </div>

    <div class="chat">

      <div id="messages">
        <div class="message blue">
          Olá! Eu sou a B.L.U.E. Como posso ajudar?
        </div>
      </div>

      <div class="input-area">

        <input
          type="text"
          id="messageInput"
          placeholder="Fale com a B.L.U.E..."
          autocomplete="off"
        >

        <button id="sendButton">
          ➤
        </button>

      </div>

    </div>

  </main>

  <footer>
    B.L.U.E. • Sistema experimental
  </footer>

  <script>

    const API_URL =
      "https://blue-api.jhefersonsousa004.workers.dev/";

    const input =
      document.getElementById("messageInput");

    const button =
      document.getElementById("sendButton");

    const messages =
      document.getElementById("messages");

    const status =
      document.getElementById("status");


    function addMessage(text, type) {

      const message =
        document.createElement("div");

      message.className =
        "message " + type;

      message.textContent = text;

      messages.appendChild(message);

      messages.scrollTop =
        messages.scrollHeight;

    }


    async function sendMessage() {

      const message =
        input.value.trim();

      if (!message) return;

      addMessage(message, "user");

      input.value = "";

      button.disabled = true;

      status.textContent =
        "B.L.U.E. está pensando...";

      try {

        const response =
          await fetch(API_URL, {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              message: message
            })

          });


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Erro ao conectar com a B.L.U.E."
          );

        }


        addMessage(
          data.reply,
          "blue"
        );


        status.textContent =
          "Sistema online • Aguardando comando";


      } catch (error) {

        console.error(error);

        addMessage(
          "Não consegui me conectar ao meu cérebro agora.",
          "blue"
        );

        status.textContent =
          "Erro de conexão";


      } finally {

        button.disabled = false;

        input.focus();

      }

    }


    button.addEventListener(
      "click",
      sendMessage
    );


    input.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          sendMessage();
        }

      }
    );

  </script>

</body>
</html>
