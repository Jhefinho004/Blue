<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue - Assistente Virtual</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header class="header">
            <h1>BLUE</h1>
            <div class="status">
                Assistente virtual
            </div>
        </header>

        <main id="chat" class="chat">

            <div class="message blue-message">
                Olá! Eu sou a Blue.
                Como posso ajudar você?
            </div>

        </main>

        <div class="input-area">

            <input
                id="messageInput"
                type="text"
                placeholder="Digite sua mensagem..."
                autocomplete="off"
            >

            <button
                id="micButton"
                class="button"
                title="Falar"
            >
                🎙️
            </button>

            <button
                id="sendButton"
                class="button"
                title="Enviar"
            >
                ➤
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
