<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blue</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #02050a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .blue {
            text-align: center;
        }

        .logo {
            width: 180px;
            height: 180px;
            border: 2px solid #00aaff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            box-shadow:
                0 0 20px #0088ff,
                0 0 60px rgba(0, 136, 255, 0.4);
            animation: pulsar 2s infinite;
        }

        .logo span {
            font-size: 32px;
            letter-spacing: 8px;
            color: #66ccff;
        }

        h1 {
            margin-top: 35px;
            font-size: 42px;
            letter-spacing: 12px;
            color: #66ccff;
            text-shadow: 0 0 20px #0088ff;
        }

        p {
            margin-top: 15px;
            color: #7f9bad;
            font-size: 15px;
        }

        @keyframes pulsar {
            0%, 100% {
                transform: scale(1);
                box-shadow:
                    0 0 20px #0088ff,
                    0 0 60px rgba(0, 136, 255, 0.4);
            }

            50% {
                transform: scale(1.05);
                box-shadow:
                    0 0 35px #00aaff,
                    0 0 90px rgba(0, 136, 255, 0.6);
            }
        }
    </style>
</head>

<body>

    <div class="blue">

        <div class="logo">
            <span>BLUE</span>
        </div>

        <h1>BLUE</h1>

        <p>Sua assistente virtual</p>

    </div>

</body>
</html>
